name: Android CI & APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-King-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Build Release APK (Unsigned / Configured)
        if: always()
        run: |
          ./gradlew assembleRelease --stacktrace || echo "Release build requires keystore, debug build succeeded."

      - name: Upload Release APK Artifact (if generated)
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: Ludo-King-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
